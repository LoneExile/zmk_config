# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9//zmk
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
# ZMK main (Zephyr 4.1) renamed nice_nano_v2 to nice_nano (rev 2.0.0, the default)
# with a required zmk variant: https://zmk.dev/blog/2025/12/09/zephyr-4-1#board-revisions
include:
  # - board: nice_nano//zmk
  #   shield: splitkb_aurora_sweep_left
  # - board: nice_nano//zmk
  #   shield: splitkb_aurora_sweep_right
  # - board: nice_nano//zmk
  #   shield: corne_left nice_view_adapter nice_view
  # - board: nice_nano//zmk
  #   shield: corne_right nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter  nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_gem
  - board: nice_nano//zmk
    shield: settings_reset
